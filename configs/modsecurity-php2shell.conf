# ====================================================================
# ModSecurity WAF Rule for PHP2Shell (CVE-2026-109618 / CVE-2026-109619)
# Drop into your OWASP CRS custom rules directory or Apache ModSecurity config
# ====================================================================

SecRule REQUEST_URI|ARGS|REQUEST_BODY "@rx (?i)PHP_SESSION_UPLOAD_PROGRESS" \
    "id:1096191,\
    phase:2,\
    deny,\
    status:403,\
    log,\
    msg:'PHP2Shell Exploit Attempt Blocked (CVE-2026-109619)',\
    severity:CRITICAL,\
    tag:'attack-rce',\
    tag:'php2shell'"
