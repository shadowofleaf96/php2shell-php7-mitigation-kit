; ====================================================================
; PHP2Shell (CVE-2026-109618 / CVE-2026-109619) Global Hardening INI
; Drop into /etc/php/7.4/mods-available/ (Ubuntu/Debian) or
; /etc/php.d/99-php2shell.ini (CentOS / RHEL / cPanel)
; ====================================================================

[Session]
; Neutralize the Use-After-Free attack vector in PHP core
session.upload_progress.enabled = 0
session.upload_progress.cleanup = 1

; Optional system hardening
; file_uploads = Off ; (Enable only if application genuinely handles file uploads)
