; ====================================================================
; PHP2Shell (CVE-2026-109618 / CVE-2026-109619) Emergency Mitigation
; Target: Shared Hosting, cPanel, PHP-FPM, FastCGI environments
; ====================================================================

; Crucial: Disable session upload progress to block the Use-After-Free RCE loop
session.upload_progress.enabled = 0

; Ensure immediate cleanup of any orphaned upload progress keys
session.upload_progress.cleanup = 1

; Optional security hardening: Enforce memory boundaries
; memory_limit = 256M
